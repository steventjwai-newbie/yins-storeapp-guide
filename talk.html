<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What I actually use AI for</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #f4f4f4;
      --dim: #8a8a8a;
      --line: #2a2a2a;
      --accent: #c8f542;
      --card: #141414;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 18px 28px 0; color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    header strong { color: var(--ink); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 14px; }
    .deck { flex: 1; position: relative; overflow: hidden; }
    .slide {
      position: absolute; inset: 0; padding: 36px 48px 88px;
      display: none; flex-direction: column; justify-content: center; gap: 18px;
    }
    .slide.on { display: flex; }
    .num { font-size: clamp(42px, 8vw, 72px); font-weight: 800; letter-spacing: -2px; line-height: 1; }
    .label { color: var(--dim); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4.4vw, 52px); line-height: 1.05; font-weight: 750; max-width: 16ch; }
    h2 { margin: 0; font-size: clamp(22px, 3.2vw, 36px); line-height: 1.15; font-weight: 650; max-width: 22ch; }
    p, li { color: #d2d2d2; font-size: clamp(16px, 2vw, 22px); line-height: 1.4; max-width: 42ch; }
    .zh { color: var(--dim); font-size: .86em; display: block; margin-top: 6px; }
    .quote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--ink); max-width: 28ch; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 920px; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 16px 18px; min-height: 140px; }
    .card b { display: block; margin-bottom: 8px; }
    .card span { color: var(--dim); font-size: 15px; line-height: 1.35; }
    ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    ol.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; max-width: 54ch; }
    ol.steps i {
      font-style: normal; font-weight: 800; color: #111; background: var(--accent);
      width: 36px; height: 36px; display: grid; place-items: center;
    }
    a.btn {
      display: inline-block; margin-top: 8px; padding: 12px 16px; background: var(--accent);
      color: #111; text-decoration: none; font-weight: 800; width: fit-content;
    }
    a.ghost { color: var(--accent); }
    footer {
      position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px 18px; background: linear-gradient(transparent, var(--bg) 30%);
    }
    .dots { display: flex; gap: 6px; }
    .dots button { width: 8px; height: 8px; border: 0; border-radius: 50%; background: #333; cursor: pointer; padding: 0; }
    .dots button.on { background: var(--accent); }
    .nav { display: flex; gap: 8px; }
    .nav button {
      min-width: 44px; height: 36px; border: 1px solid var(--line); background: #111; color: var(--ink); cursor: pointer;
    }
    .hint { color: #555; font-size: 11px; }
    @media (max-width: 720px) {
      .slide { padding: 24px 20px 80px; }
      .grid { grid-template-columns: 1fr; }
      h1 { max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>AI share · 4 min</div>
    <strong>No perfect slides. Something I actually used.</strong>
  </header>
  <main class="deck" id="deck"></main>
  <footer>
    <div class="dots" id="dots"></div>
    <div class="hint">← → or tap</div>
    <div class="nav">
      <button type="button" id="prev">Prev</button>
      <button type="button" id="next">Next</button>
    </div>
  </footer>
  <script>
    const YINS = "https://steventjwai-newbie.github.io/yins-storeapp-guide/";
    const slides = [
      {
        html: `
          <div class="label">Open</div>
          <h1>I use AI as a doorbell, not as a brain.</h1>
          <p>Two boring things I actually run: a one-page site for Yin’s customers, and Discord as the front door to a private vault.<span class="zh">不是第二大脑演讲。是我真的在用的两件小事。</span></p>
        `
      },
      {
        html: `
          <div class="num">01</div>
          <div class="label">Topic · 你分享什么？</div>
          <h2>A guest page for Yin’s, and Discord as the doorbell to my notes.</h2>
          <p>Site is for people. Discord is for me. Vault is so the model does not invent next week.</p>
        `
      },
      {
        html: `
          <div class="num">02</div>
          <div class="label">Problem · 它解决什么问题？</div>
          <h2>PDFs go unread. Chat answers disappear. Notes stay closed on the floor.</h2>
          <p>Staff already have Discord. Guests only need a link. The long memory should not live in a thread.</p>
        `
      },
      {
        html: `
          <div class="num">03</div>
          <div class="label">Method · Workflow</div>
          <ol class="steps">
            <li><i>1</i><div>Dump messy stuff into a Git-backed vault. Not only a chat.</div></li>
            <li><i>2</i><div>Ask AI to draft. Keep the public page stupid: 3–4 screens.</div></li>
            <li><i>3</i><div>Discord = ask / paste / “make a guide.” Vault = source of truth.</div></li>
            <li><i>4</i><div>Rule: if it is not in the vault, the bot does not get to invent it.</div></li>
          </ol>
        `
      },
      {
        html: `
          <div class="label">Same pattern, three doors</div>
          <div class="grid">
            <div class="card"><b>Site</b><span>What a guest or auntie sees. One page. No login.</span></div>
            <div class="card"><b>Discord</b><span>What I already open. Ask, paste, get a draft.</span></div>
            <div class="card"><b>Vault</b><span>Private. I do not screenshare this. Memory with a source.</span></div>
          </div>
        `
      },
      {
        html: `
          <div class="num">04</div>
          <div class="label">Demo · 现场演示</div>
          <h2>Open the Yin’s page. Click the tabs. That is the live thing.</h2>
          <p>I will not open the vault. I will not tour architecture. If there is time: one Discord question → one draft → human keeps the page short.</p>
          <a class="btn" href="${YINS}" target="_blank" rel="noopener">Open Yin’s guide</a>
        `
      },
      {
        html: `
          <p class="quote">The site is for people. Discord is for me. The vault is so the AI doesn’t gaslight me next week.</p>
          <p><a class="ghost" href="${YINS}" target="_blank" rel="noopener">${YINS}</a></p>
        `
      }
    ];

    const deck = document.getElementById("deck");
    const dots = document.getElementById("dots");
    let i = 0;
    slides.forEach((s, n) => {
      const el = document.createElement("section");
      el.className = "slide" + (n === 0 ? " on" : "");
      el.innerHTML = s.html;
      deck.appendChild(el);
      const d = document.createElement("button");
      d.type = "button";
      if (n === 0) d.className = "on";
      d.onclick = () => go(n);
      dots.appendChild(d);
    });
    const all = [...deck.querySelectorAll(".slide")];
    const dotBtns = [...dots.querySelectorAll("button")];
    function go(n) {
      i = (n + all.length) % all.length;
      all.forEach((el, k) => el.classList.toggle("on", k === i));
      dotBtns.forEach((el, k) => el.classList.toggle("on", k === i));
    }
    document.getElementById("prev").onclick = () => go(i - 1);
    document.getElementById("next").onclick = () => go(i + 1);
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(i + 1); }
      if (e.key === "ArrowLeft") go(i - 1);
    });
  </script>
</body>
</html>
